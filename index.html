<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator with Dark Mode & %</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --bg:#f2f4f8;
    --calc:#ffffff;
    --text:#000;
    --btn:#e0e6ed;
    --hover:#cfd8e3;
    --op:#4f6ef7;
}
body.dark{
    --bg:#121212;
    --calc:#1f1f1f;
    --text:#fff;
    --btn:#2a2a2a;
    --hover:#3a3a3a;
    --op:#ff9800;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--bg);
    font-family:Arial, sans-serif;
    transition:0.3s;
}

.calculator{
    background:var(--calc);
    padding:20px;
    width:300px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    color:var(--text);
}

.header{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

#display{
    width:100%;
    height:50px;
    font-size:22px;
    text-align:right;
    padding:10px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    background:var(--btn);
    color:var(--text);
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

button{
    height:50px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:var(--btn);
    color:var(--text);
}
button:hover{background:var(--hover);}

.operator{background:var(--op); color:#fff;}
.equal{background:#28a745; color:#fff; grid-column:span 2;}
.clear{background:#dc3545; color:#fff;}
</style>
</head>

<body>

<div class="calculator">
    <div class="header">
        <b>Calculator</b>
        <span onclick="toggleMode()" style="cursor:pointer">🌙 / ☀️</span>
    </div>

    <input type="text" id="display" disabled>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="percent()">%</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
let display = document.getElementById("display");

function append(val){
    display.value += val;
}

function clearDisplay(){
    display.value="";
}

function deleteLast(){
    display.value = display.value.slice(0,-1);
}

function percent(){
    if(display.value !== ""){
        display.value = display.value / 100;
    }
}

function calculate(){
    try{
        display.value = eval(display.value);
    }catch{
        display.value="Error";
    }
}

function toggleMode(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
